# Compila los APK de Android con Godot 4.3 cada vez que se sube código a main
# (o a mano desde la pestaña "Actions" → "Compilar APK" → "Run workflow").
#
# Firma: si el repositorio tiene los secretos ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_ALIAS y ANDROID_KEYSTORE_PASSWORD, se usa esa llave
# (recomendado, así las actualizaciones se instalan encima de la versión
# anterior). Si no, se genera una llave temporal.
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Descargar Godot y plantillas de exportación
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/android_*' 'templates/version.txt' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Preparar llaves y ajustes del editor
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$HOME/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$HOME/release.keystore" -storepass tuctuc-temporal -alias tuctuc \
              -keypass tuctuc-temporal -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tuc Tuc Guastatoya,C=GT"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=tuctuc" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=tuctuc-temporal" >> "$GITHUB_ENV"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Importar recursos
        run: ./godot --headless --editor --quit --path . || true

      - name: Exportar APK
        run: |
          mkdir -p build
          ./godot --headless --path . --export-release "Android" build/TucTucGuastatoya.apk
          ./godot --headless --path . --export-release "Android arm64 (liviano)" build/TucTucGuastatoya-arm64.apk
          rm -f build/*.idsig
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: TucTucGuastatoya-APK
          path: build/*.apk
