name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Si configuraste el secreto GOOGLE_SERVICES_JSON (ver README), se crea el archivo
      # de Firebase antes de compilar. Si no, la app se compila sin nube.
      - name: Configuración de Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase: configurado desde el secreto GOOGLE_SERVICES_JSON"
          elif [ -f app/google-services.json ]; then
            echo "Firebase: usando app/google-services.json del repositorio"
          else
            echo "::warning::Firebase no configurado: la app funcionará solo con datos locales"
          fi

      - name: Tests unitarios
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Guastaccesorio-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
