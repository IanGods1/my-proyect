# Cambia las fotos del catálogo de lentes por las de un álbum nuevo de Google Fotos.
# Se lanza desde la página del catálogo (botón "Actualizar catálogo")
# o a mano en GitHub: Actions → Actualizar catálogo → Run workflow.
name: Actualizar catálogo

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link del álbum compartido de Google Fotos'
        required: true

permissions:
  contents: write

concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar navegador
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium

      - name: Descargar fotos del álbum
        env:
          ALBUM_URL: ${{ inputs.url }}
        run: node .github/scripts/actualizar-catalogo.js "$ALBUM_URL" catalogo-lentes

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A catalogo-lentes
          git commit -m "Catálogo actualizado desde Google Fotos"
          git push
