name: Versión web

# Cada cambio en la carpeta web/ prueba y compila la versión web y deja el resultado como archivo
# descargable. NO publica en GitHub Pages: este repositorio ya publica otra aplicación desde main.
# Para el enlace de la web ver README ("Dónde publicarla").
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Guardar la versión compilada
        uses: actions/upload-artifact@v4
        with:
          name: Guastaccesorio-web
          path: web/dist
          include-hidden-files: true
