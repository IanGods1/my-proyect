<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de Lentes</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1c1c1c;--muted:#6b6b6b;--acc:#d64545}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(246,246,244,.95);backdrop-filter:blur(8px);padding:14px 16px 10px;border-bottom:1px solid #e3e3e0}
h1{margin:0;font-size:1.35rem}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.bar button{border:1px solid #d5d5d2;background:#fff;border-radius:999px;padding:7px 14px;font-size:.9rem;cursor:pointer}
.bar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar input{flex:1;min-width:120px;border:1px solid #d5d5d2;border-radius:999px;padding:7px 14px;font-size:.9rem}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.item{position:relative;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;aspect-ratio:3/4}
.item img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.75rem;font-weight:600;padding:2px 7px;border-radius:999px}
.fav{position:absolute;right:4px;top:2px;font-size:1.4rem;background:none;border:0;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));color:#fff;line-height:1;padding:4px}
.fav.on{color:var(--acc)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
#lb{position:fixed;inset:0;background:#000;display:none;z-index:10;flex-direction:column}
#lb.open{display:flex}
#lb .top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:12px 14px}
#lb .top button{background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer}
#lb .top .fav{position:static;filter:none}#lb .top .fav.on{color:var(--acc)}
#lb .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;font-size:2rem;width:48px;height:64px;cursor:pointer;border-radius:8px}
#lb .prev{left:8px}#lb .next{right:8px}
@media print{header .bar,.fav{display:none}header{position:static}main{grid-template-columns:repeat(3,1fr)}.item{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>🕶️ Catálogo de Lentes</h1>
  <div class="sub"><span id="total"></span> fotos · Toca una foto para verla en grande · ♥ para marcar las que te gusten</div>
  <div class="bar">
    <button id="bTodos" class="on">Todas</button>
    <button id="bFavs">♥ Marcadas (<span id="nf">0</span>)</button>
    <input id="ir" type="number" inputmode="numeric" placeholder="Ir al nº…">
  </div>
</header>
<main id="grid"></main>
<div id="lb">
  <div class="top"><span id="lbn"></span><span><button class="fav" id="lbfav">♥</button> <button id="cerrar" aria-label="Cerrar">✕</button></span></div>
  <div class="stage" id="stage"><img id="lbimg" alt=""></div>
  <button class="nav prev" id="prev" aria-label="Anterior">‹</button>
  <button class="nav next" id="next" aria-label="Siguiente">›</button>
</div>
<script>
const FOTOS = ['001', '002', '003', '004', '005', '006', '007', '008', '009', '010', '011', '012', '013', '014', '015', '016', '017', '018', '019', '020', '021', '022', '023', '024', '025', '026', '027', '028', '029', '030', '031', '032', '033', '034', '035', '036', '037', '038', '039', '040', '041', '042', '043', '044', '045', '046', '047', '048', '049', '050', '051', '052', '053', '054', '055', '056', '057', '058', '059', '060', '061', '062', '063', '064', '065', '066', '067', '068', '069', '070', '071', '072', '073', '074', '075', '076', '077', '078', '079', '080', '081', '082', '083', '084', '085', '086', '087', '088', '089', '090', '091', '092', '093', '094', '095', '096', '097', '098', '099', '100', '101', '102', '103', '104', '105', '106', '107', '108', '109', '110', '111', '112', '113', '114', '115', '116', '117', '118', '119', '120', '121', '122', '123', '124', '125', '126', '127', '128', '129', '130', '131', '132', '133', '134', '135', '136', '137', '138', '139', '140', '141', '142', '143', '144', '145', '146', '147', '148', '149', '150', '151', '152', '153', '154', '155', '156', '157', '158', '159', '160', '161', '162', '163', '164', '165', '166', '167', '168', '169', '170', '171', '172', '173', '174', '175', '176', '177', '178', '179', '180', '181', '182', '183', '184', '185', '186', '187', '188', '189', '190', '191', '192', '193', '194', '195', '196', '197', '198', '199', '200', '201', '202', '203', '204', '205', '206', '207', '208', '209', '210', '211', '212', '213', '214', '215', '216', '217', '218', '219', '220', '221', '222', '223', '224', '225', '226', '227', '228', '229', '230', '231', '232', '233', '234', '235', '236', '237', '238', '239', '240', '241', '242', '243', '244', '245', '246', '247', '248', '249', '250', '251', '252', '253', '254', '255', '256', '257', '258', '259', '260', '261', '262', '263', '264', '265', '266', '267', '268', '269', '270', '271', '272', '273', '274', '275', '276', '277', '278', '279', '280', '281', '282', '283', '284', '285', '286', '287', '288', '289', '290', '291', '292', '293', '294', '295', '296', '297', '298', '299', '300', '301', '302', '303', '304', '305', '306', '307', '308'];
const KEY='catalogo-lentes-favs';
let favs=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
let soloFavs=false, lista=[], pos=0;
const $=id=>document.getElementById(id);
$('total').textContent=FOTOS.length;
function guardar(){localStorage.setItem(KEY,JSON.stringify([...favs]));$('nf').textContent=favs.size;}
function pintar(){
  lista=FOTOS.filter(f=>!soloFavs||favs.has(f));
  const g=$('grid');
  if(!lista.length){g.innerHTML='<div class="empty">Aún no has marcado ninguna foto con ♥</div>';return;}
  g.innerHTML=lista.map((f,i)=>`<div class="item" id="n${+f}" data-i="${i}"><img loading="lazy" src="mini/${f}.jpg" alt="Lentes nº ${+f}"><span class="num">${+f}</span><button class="fav ${favs.has(f)?'on':''}" data-n="${f}" aria-label="Marcar">♥</button></div>`).join('');
}
function alternar(n){favs.has(n)?favs.delete(n):favs.add(n);guardar();}
$('grid').addEventListener('click',e=>{
  const b=e.target.closest('.fav');
  if(b){e.stopPropagation();alternar(b.dataset.n);b.classList.toggle('on');if(soloFavs)pintar();return;}
  const it=e.target.closest('.item'); if(it) abrir(+it.dataset.i);
});
function mostrar(){const f=lista[pos];$('lbimg').src='fotos/'+f+'.jpg';$('lbn').textContent=`Nº ${+f}  ·  ${pos+1} de ${lista.length}`;$('lbfav').classList.toggle('on',favs.has(f));
  [pos-1,pos+1].forEach(k=>{if(lista[k])new Image().src='fotos/'+lista[k]+'.jpg';});}
function abrir(i){pos=i;$('lb').classList.add('open');mostrar();history.pushState({lb:1},'');}
function cerrar(){if($('lb').classList.contains('open')){$('lb').classList.remove('open');if(soloFavs)pintar();}}
function mover(d){pos=(pos+d+lista.length)%lista.length;mostrar();}
$('cerrar').onclick=()=>history.back();
window.addEventListener('popstate',cerrar);
$('prev').onclick=()=>mover(-1);$('next').onclick=()=>mover(1);
$('lbfav').onclick=()=>{alternar(lista[pos]);mostrar();const b=document.querySelector(`.fav[data-n="${lista[pos]}"]`);if(b)b.classList.toggle('on',favs.has(lista[pos]));};
document.addEventListener('keydown',e=>{if(!$('lb').classList.contains('open'))return;if(e.key==='ArrowLeft')mover(-1);if(e.key==='ArrowRight')mover(1);if(e.key==='Escape')history.back();});
let x0=null;$('stage').addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
$('stage').addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)mover(dx<0?1:-1);x0=null;});
$('bTodos').onclick=()=>{soloFavs=false;$('bTodos').classList.add('on');$('bFavs').classList.remove('on');pintar();};
$('bFavs').onclick=()=>{soloFavs=true;$('bFavs').classList.add('on');$('bTodos').classList.remove('on');pintar();};
$('ir').addEventListener('change',e=>{const n=+e.target.value;if(soloFavs)$('bTodos').click();const el=$('n'+n);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='3px solid #d64545';setTimeout(()=>el.style.outline='',2000);}e.target.value='';});
guardar();pintar();
</script>
</body>
</html>
